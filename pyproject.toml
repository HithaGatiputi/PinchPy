[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinchpy"
version = "0.1.0"
description = "Pinch analysis and heat exchanger network research project"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "xgboost",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
